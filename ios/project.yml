name: LittleCompany
schemes:
  LittleCompany:
    build:
      targets:
        LittleCompany: all
    test:
      targets: [LittleCompanyTests]
options:
  bundleIdPrefix: app.littlecompany
  deploymentTarget:
    iOS: '17.0'
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    exactVersion: 6.27.0
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.6.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
targets:
  LittleCompanyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LittleCompanyTests]
    dependencies:
      - target: LittleCompany
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  LittleCompany:
    type: application
    platform: iOS
    sources: [LittleCompany]
    dependencies:
      - package: LiveKit
      - package: Lottie
      - package: RiveRuntime
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        INFOPLIST_KEY_CFBundleDisplayName: A Little Company
        PRODUCT_BUNDLE_IDENTIFIER: app.littlecompany.companion
        DEVELOPMENT_TEAM: 2NPACMVW3K
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listen to your voice for conversations with your companion.
        INFOPLIST_KEY_NSCameraUsageDescription: A Little Company uses voice only and does not capture photos or video. Camera access is not needed for conversations.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Play your favourite songs when you ask.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad": UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
